name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt pytest-cov
      - run: cd api && pytest --cov=app --cov-fail-under=60 -q
      - run: cd indexer && pytest -q

  build-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push, tagged with the commit SHA
        run: |
          for i in api indexer ui; do
            docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-$i:${{ github.sha }} $i
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-$i:${{ github.sha }}
          done

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: rahbar
          config: .github/kind-config.yaml
      - name: Ingress controller
        run: |
          kubectl apply -f https://kind.sigs.k8s.io/examples/ingress/deploy-ingress-nginx.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller --timeout=180s
          # The admission webhook can lag behind the controller pod being Ready.
          for i in $(seq 1 30); do
            kubectl get endpoints ingress-nginx-controller-admission -n ingress-nginx \
              -o jsonpath='{.subsets[*].addresses[*].ip}' | grep -q . && break
            sleep 2
          done
      - name: Deploy the SHA-tagged images
        run: |
          cd k8s/overlays/smoke
          for i in api indexer ui; do
            kustomize edit set image rahbar-$i=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-$i:${{ github.sha }}
          done
          cd ../../..
          # apply is idempotent, so retrying covers a webhook that is not serving yet
          apply() {
            for i in 1 2 3 4 5 6; do
              kubectl apply -k k8s/overlays/smoke && return 0
              echo "apply failed, retrying in 10s"; sleep 10
            done
            return 1
          }
          apply
          kubectl rollout status statefulset/chroma -n rahbar --timeout=180s
          kubectl delete job indexer -n rahbar --ignore-not-found
          apply
      - name: Wait for the rollout
        run: |
          kubectl wait --for=condition=complete job/indexer -n rahbar --timeout=300s
          kubectl rollout status deploy/api -n rahbar --timeout=300s
          kubectl rollout status deploy/ui -n rahbar --timeout=120s
      - name: Smoke test through the Ingress
        run: |
          for i in $(seq 1 20); do
            curl -fsS -H "Host: rahbar.local" -X POST http://localhost/api/ask \
              -H 'Content-Type: application/json' \
              -d '{"question":"What is the attendance requirement?"}' && exit 0
            sleep 5
          done
          exit 1
      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -n rahbar | tail -60