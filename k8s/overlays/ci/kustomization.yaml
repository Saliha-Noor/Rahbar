apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - { name: rahbar-api, newTag: ci }
  - { name: rahbar-indexer, newTag: ci }
  - { name: rahbar-ui, newTag: ci }
patches:
  - target: { kind: ConfigMap, name: rahbar-config }
    patch: |-
      - op: replace
        path: /data/LLM_PROVIDER
        value: stub