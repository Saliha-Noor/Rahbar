apiVersion: batch/v1
kind: Job
metadata:
  name: eval
  namespace: rahbar
spec:
  backoffLimit: 0            
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: eval }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      serviceAccountName: rahbar-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: eval
          image: rahbar-eval:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: rahbar-config }
          env:
            - { name: LABEL, value: baseline }
            - { name: API_URL, value: "http://api:8000" }
            - { name: STAGE, value: A }
            - { name: GATE_ONLY, value: "0" }
            - { name: TRACE_DIR, value: /data/traces }
            - { name: RESULTS_DIR, value: /data/results }
            - { name: GATE_CONFIG, value: /config/gate.yaml }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:                 
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: ragops, mountPath: /data }
            - { name: gate, mountPath: /config, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ragops
          persistentVolumeClaim:
            claimName: ragops-data
        - name: gate
          configMap:
            name: rahbar-gate
