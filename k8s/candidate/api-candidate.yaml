# F3: the candidate API. Same image and ConfigMap as the live API, but its own Deployment, its own
# Service (api-candidate) and its OWN COLLECTION. The evaluation Job is pointed at this Service.
# Change the collection (and anything else under test) with the env block below.
#   kubectl apply -f k8s/candidate/api-candidate.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: rahbar
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: api-candidate }
  template:
    metadata:
      labels: { app: api-candidate }
    spec:
      enableServiceLinks: false
      serviceAccountName: rahbar-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: rahbar-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: rahbar-config }
            - secretRef: { name: rahbar-secret, optional: true }
          env:                       # explicit env wins over envFrom
            - { name: CHROMA_COLLECTION, value: rahbar-cand }
            - { name: EMBED_VERSION, value: "1" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /healthz, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: ragops, mountPath: /data }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ragops
          persistentVolumeClaim:
            claimName: ragops-data
---
apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  namespace: rahbar
spec:
  type: ClusterIP
  selector: { app: api-candidate }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
