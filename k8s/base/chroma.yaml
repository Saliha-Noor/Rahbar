apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels: { app: chroma }
  template:
    metadata:
      labels: { app: chroma }
    spec:
      enableServiceLinks: false
      serviceAccountName: rahbar-chroma
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - { name: IS_PERSISTENT, value: "TRUE" }
            - { name: PERSIST_DIRECTORY, value: /data }
            - { name: ANONYMIZED_TELEMETRY, value: "FALSE" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
          startupProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v2/heartbeat, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: chroma-data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
spec:
  type: ClusterIP
  selector: { app: chroma }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
