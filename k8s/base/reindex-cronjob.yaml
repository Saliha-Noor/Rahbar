# Same image and arguments as the indexer Job. Manual run:
#   kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 4
      template:
        metadata:
          labels: { app: indexer }
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          serviceAccountName: rahbar-indexer
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              args: ["python", "-m", "pipeline.run"]
              envFrom:
                - configMapRef: { name: rahbar-config }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: corpus, mountPath: /corpus }   # rw: _quarantine, _archive, _state, _reports
          volumes:
            - name: tmp
              emptyDir: {}
            - name: corpus
              persistentVolumeClaim:
                claimName: corpus-data
