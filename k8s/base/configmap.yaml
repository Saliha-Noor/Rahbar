apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
data:
  # Week-1 values: stubs plus the dummy index. Change on Thursday.
  RETRIEVER: "stub"
  LLM_PROVIDER: "stub"
  EMBED_MODEL: "dummy-768"          # the pin; indexer and api read this same key
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  TOP_K: "5"
  # Facts and JSON belong at 0 to 0.3: low variance, but 0 does not cure hallucination.
  TEMPERATURE: "0.2"
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  LOG_LEVEL: "INFO"
  # Key names below must match what the API code reads. Confirm with Saliha.
  RELEVANCE_FLOOR: "0.35"
  CACHE_THRESHOLD: "0.92"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
