# Release-gate thresholds. Edit this, re-run the gate Job: the outcome changes, nothing is rebuilt.
#   kubectl edit configmap rahbar-gate -n rahbar
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-gate
data:
  gate.yaml: |
    recall_at_5_max_drop_points: 2
    faithfulness_min: 0.60
    p95_latency_max_s: 60
    abstention_not_below_baseline: true
    citation_validity_min: 0.90
