# Deny by default, then allow only the paths the architecture needs (section 4.7).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Without this, default-deny egress also blocks DNS and every service name stops resolving.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# ui: from the Ingress controller only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ui-from-ingress
spec:
  podSelector:
    matchLabels: { app: ui }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { protocol: TCP, port: 8080 }
---
# api: from the Ingress controller and from the ui
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - podSelector:
            matchLabels: { app: ui }
      ports:
        - { protocol: TCP, port: 8000 }
---
# api egress: chroma, redis, and the LLM host
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
spec:
  podSelector:
    matchLabels: { app: api }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: chroma }
      ports:
        - { protocol: TCP, port: 8000 }
    - to:
        - podSelector:
            matchLabels: { app: redis }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - ipBlock: { cidr: 192.168.49.1/32 }
      ports:
        - { protocol: TCP, port: 11434 }
---
# chroma: from api and indexer only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chroma-ingress
spec:
  podSelector:
    matchLabels: { app: chroma }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: api }
        - podSelector:
            matchLabels: { app: indexer }
      ports:
        - { protocol: TCP, port: 8000 }
---
# redis: from api only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: api }
      ports:
        - { protocol: TCP, port: 6379 }
---
# indexer egress: chroma and the host that serves embeddings
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: indexer-egress
spec:
  podSelector:
    matchLabels: { app: indexer }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app: chroma }
      ports:
        - { protocol: TCP, port: 8000 }
    - to:
        - ipBlock: { cidr: 192.168.49.1/32 }
      ports:
        - { protocol: TCP, port: 11434 }